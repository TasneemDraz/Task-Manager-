name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit tests, then integration tests against PostgreSQL via Testcontainers
      # (Docker is preinstalled on GitHub's Ubuntu runners).
      - name: Build and test
        run: mvn -B verify
