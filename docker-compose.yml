services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskmanager}
      POSTGRES_USER: ${POSTGRES_USER:-taskmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskmanager}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-taskmanager}
      DB_USERNAME: ${POSTGRES_USER:-taskmanager}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-taskmanager}
      # Demo defaults so `docker compose up` works out of the box. Override them in .env.
      JWT_SECRET: ${JWT_SECRET:-ZGVtby1vbmx5LXNlY3JldC1jaGFuZ2UtbWUtaW4tZW52LWZpbGUtMzJi}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-PT24H}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@taskmanager.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "8080:8080"

volumes:
  db-data:
